<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web3 Auth 测试工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.2.0/ethers.umd.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        max-width: 600px;
        width: 100%;
        padding: 40px;
      }
      h1 {
        color: #667eea;
        margin-bottom: 10px;
        font-size: 28px;
      }
      .subtitle {
        color: #666;
        margin-bottom: 30px;
        font-size: 14px;
      }
      .status {
        background: #f5f5f5;
        border-radius: 10px;
        padding: 15px;
        margin-bottom: 20px;
        font-size: 14px;
      }
      .status-item {
        margin: 5px 0;
        display: flex;
        justify-content: space-between;
      }
      .status-label {
        color: #666;
        font-weight: 500;
      }
      .status-value {
        color: #333;
        font-family: 'Courier New', monospace;
        word-break: break-all;
      }
      .btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 10px;
        padding: 15px 30px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        margin-bottom: 10px;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn:disabled {
        background: #ccc;
        cursor: not-allowed;
        transform: none;
      }
      .btn-secondary {
        background: #6c757d;
      }
      .btn-danger {
        background: #dc3545;
      }
      .btn-success {
        background: #28a745;
      }
      .log {
        background: #1e1e1e;
        color: #fff;
        border-radius: 10px;
        padding: 15px;
        margin-top: 20px;
        max-height: 300px;
        overflow-y: auto;
        font-family: 'Courier New', monospace;
        font-size: 12px;
        line-height: 1.6;
      }
      .log-info {
        color: #4fc3f7;
      }
      .log-success {
        color: #4caf50;
      }
      .log-error {
        color: #f44336;
      }
      .log-warning {
        color: #ff9800;
      }
      .input-group {
        margin-bottom: 15px;
      }
      .input-group label {
        display: block;
        margin-bottom: 5px;
        color: #666;
        font-weight: 500;
        font-size: 14px;
      }
      .input-group input {
        width: 100%;
        padding: 12px;
        border: 2px solid #e0e0e0;
        border-radius: 8px;
        font-size: 14px;
        transition: border-color 0.2s;
      }
      .input-group input:focus {
        outline: none;
        border-color: #667eea;
      }
      .sessions {
        margin-top: 20px;
      }
      .session-item {
        background: #f9f9f9;
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 10px;
        font-size: 13px;
      }
      .session-item strong {
        color: #667eea;
      }
      .badge {
        background: #667eea;
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 11px;
        margin-left: 5px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🔐 Web3 Auth 测试工具</h1>
      <p class="subtitle">基于以太坊钱包签名的认证系统测试</p>
      <h1>不要使用liveServer启动，使用pnpm run test:auth:page</h1>
      <p>
        如果使用liveServer启动，会自动刷新页面，导致登录失败，metamask弹窗会导致刷新
      </p>

      <div class="input-group">
        <label for="apiUrl">API 地址</label>
        <input
          type="text"
          id="apiUrl"
          value="http://localhost:3000/api"
          placeholder="http://localhost:3000/api"
        />
      </div>

      <div class="status" id="status">
        <div class="status-item">
          <span class="status-label">钱包状态:</span>
          <span class="status-value" id="walletStatus">未连接</span>
        </div>
        <div class="status-item">
          <span class="status-label">钱包地址:</span>
          <span class="status-value" id="walletAddress">-</span>
        </div>
        <div class="status-item">
          <span class="status-label">登录状态:</span>
          <span class="status-value" id="loginStatus">未登录</span>
        </div>
        <div class="status-item">
          <span class="status-label">用户名:</span>
          <span class="status-value" id="username">-</span>
        </div>
      </div>

      <button type="button" class="btn" onclick="connectWallet(event)">
        1️⃣ 连接 MetaMask
      </button>
      <button
        type="button"
        class="btn"
        onclick="login(event)"
        id="loginBtn"
        disabled
      >
        2️⃣ 登录（签名验证）
      </button>
      <button
        type="button"
        class="btn btn-success"
        onclick="getMe()"
        id="getMeBtn"
        disabled
      >
        3️⃣ 获取用户信息
      </button>
      <button
        type="button"
        class="btn btn-secondary"
        onclick="refreshTokenFunc()"
        id="refreshBtn"
        disabled
      >
        🔄 刷新 Token
      </button>
      <button
        type="button"
        class="btn btn-secondary"
        onclick="getSessions()"
        id="sessionsBtn"
        disabled
      >
        📱 查看所有会话
      </button>
      <button
        type="button"
        class="btn btn-danger"
        onclick="logout()"
        id="logoutBtn"
        disabled
      >
        🚪 登出
      </button>

      <div class="sessions" id="sessionsContainer" style="display: none"></div>

      <div class="log" id="log"></div>
    </div>
    <script>
      let provider, signer, walletAddress;
      let accessToken, refreshToken;
      const API_URL = () => document.getElementById('apiUrl').value;

      // 日志函数
      function log(message, type = 'info') {
        const logDiv = document.getElementById('log');
        const time = new Date().toLocaleTimeString();
        const colors = {
          info: 'log-info',
          success: 'log-success',
          error: 'log-error',
          warning: 'log-warning',
        };
        logDiv.innerHTML += `<div class="${colors[type]}">[${time}] ${message}</div>`;
        logDiv.scrollTop = logDiv.scrollHeight;
      }

      // 更新状态显示
      function updateStatus() {
        document.getElementById('walletStatus').textContent = provider
          ? '已连接'
          : '未连接';
        document.getElementById('walletAddress').textContent =
          walletAddress || '-';
        document.getElementById('loginStatus').textContent = accessToken
          ? '已登录'
          : '未登录';

        // 更新按钮状态
        document.getElementById('loginBtn').disabled =
          !walletAddress || !!accessToken;
        document.getElementById('getMeBtn').disabled = !accessToken;
        document.getElementById('refreshBtn').disabled = !refreshToken;
        document.getElementById('sessionsBtn').disabled = !accessToken;
        document.getElementById('logoutBtn').disabled = !accessToken;
      }

      // 1. 连接钱包
      async function connectWallet(event) {
        // 阻止任何可能的默认行为
        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }

        try {
          if (!window.ethereum) {
            log('❌ 未检测到 MetaMask，请先安装 MetaMask 钱包', 'error');
            return;
          }

          log('🔌 正在连接 MetaMask...', 'info');
          provider = new ethers.providers.Web3Provider(window.ethereum);
          await provider.send('eth_requestAccounts', []);
          signer = provider.getSigner();
          walletAddress = await signer.getAddress();

          log(`✅ 钱包连接成功！地址: ${walletAddress}`, 'success');
          updateStatus();
        } catch (error) {
          log(`❌ 钱包连接失败: ${error.message}`, 'error');
        }
      }

      // 2. 登录
      async function login(event) {
        // 阻止任何可能的默认行为
        if (event) {
          event.preventDefault();
          event.stopPropagation();
        }

        // 标记开始处理
        window.isProcessing = true;
        console.log('🔄 开始登录流程, isProcessing = true');

        try {
          log('📝 步骤 1/3: 正在获取 Nonce...', 'info');

          // 2.1 获取 Nonce
          const nonceResponse = await fetch(`${API_URL()}/auth/nonce`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ walletAddress }),
          });

          if (!nonceResponse.ok) {
            throw new Error(`获取 Nonce 失败: ${nonceResponse.statusText}`);
          }

          const nonceResponseData = await nonceResponse.json();

          // 处理响应拦截器包装的数据格式
          const nonceData = nonceResponseData.data || nonceResponseData;

          log(`✅ Nonce 获取成功: ${nonceData.nonce}`, 'success');
          log(`📄 待签名消息:\n${nonceData.message}`, 'info');

          // 调试：检查消息格式
          console.log('=== SIWE 消息详情 ===');
          console.log('原始响应:', nonceResponseData);
          console.log('提取的数据:', nonceData);
          console.log('消息长度:', nonceData.message.length);
          console.log('消息行数:', nonceData.message.split('\n').length);
          console.log('完整消息:', nonceData.message);
          console.log(
            '消息字节:',
            Array.from(nonceData.message).map((c) => c.charCodeAt(0)),
          );

          // 2.2 签名消息
          log(
            '✍️ 步骤 2/3: 正在请求签名（请在 MetaMask 中确认）...',
            'warning',
          );

          // 防止 MetaMask 弹窗导致页面刷新
          let signature;
          try {
            signature = await signer.signMessage(nonceData.message);
          } catch (error) {
            // 用户拒绝签名或其他错误
            if (error.code === 4001) {
              throw new Error('用户拒绝签名');
            }
            throw error;
          }

          log(`✅ 签名成功: ${signature.substring(0, 20)}...`, 'success');

          // 2.3 登录验证
          log('🔐 步骤 3/3: 正在验证签名...', 'info');
          const loginResponse = await fetch(`${API_URL()}/auth/login`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              walletAddress,
              signature,
              message: nonceData.message,
            }),
          });

          if (!loginResponse.ok) {
            let errorMessage = '登录失败';
            try {
              const errorData = await loginResponse.json();
              errorMessage =
                errorData.message ||
                errorData.error ||
                JSON.stringify(errorData);
              log(
                `📋 错误详情: ${JSON.stringify(errorData, null, 2)}`,
                'error',
              );
            } catch (e) {
              errorMessage = `HTTP ${loginResponse.status}: ${loginResponse.statusText}`;
            }
            throw new Error(errorMessage);
          }

          const loginResponseData = await loginResponse.json();

          // 处理响应拦截器包装的数据格式
          const loginData = loginResponseData.data || loginResponseData;

          // 验证响应数据
          if (!loginData.accessToken || !loginData.refreshToken) {
            throw new Error('服务器响应格式错误：缺少 Token');
          }

          accessToken = loginData.accessToken;
          refreshToken = loginData.refreshToken;

          document.getElementById('username').textContent =
            loginData.user?.username || '未知用户';
          log(`🎉 登录成功！欢迎 ${loginData.user?.username}`, 'success');
          log(`🔑 Access Token: ${accessToken.substring(0, 30)}...`, 'info');
          log(`🔄 Refresh Token: ${refreshToken.substring(0, 30)}...`, 'info');

          updateStatus();

          // 延迟重置 isProcessing，确保所有状态更新完成
          await new Promise((resolve) => setTimeout(resolve, 100));
        } catch (error) {
          log(`❌ 登录失败: ${error.message}`, 'error');
          console.error('完整错误信息:', error);

          // 显示调试信息
          if (error.stack) {
            console.error('错误堆栈:', error.stack);
          }
        } finally {
          // 确保 isProcessing 被重置
          window.isProcessing = false;
          console.log('✅ 登录流程结束, isProcessing = false');
        }
      }

      // 3. 获取用户信息
      async function getMe() {
        try {
          log('👤 正在获取用户信息...', 'info');

          const response = await fetch(`${API_URL()}/auth/me`, {
            method: 'GET',
            headers: {
              Authorization: `Bearer ${accessToken}`,
            },
          });

          if (!response.ok) {
            throw new Error(`获取用户信息失败: ${response.statusText}`);
          }

          const responseData = await response.json();
          const user = responseData.data || responseData;

          log(`✅ 用户信息:`, 'success');
          log(`   - 钱包地址: ${user.walletAddress}`, 'info');
          log(`   - 用户 ID: ${user.userId}`, 'info');
          log(`   - 用户名: ${user.username}`, 'info');
        } catch (error) {
          log(`❌ 获取用户信息失败: ${error.message}`, 'error');
        }
      }

      // 4. 刷新 Token
      async function refreshTokenFunc() {
        try {
          log('🔄 正在刷新 Token...', 'info');

          const response = await fetch(`${API_URL()}/auth/refresh`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ refreshToken }),
          });

          if (!response.ok) {
            throw new Error(`Token 刷新失败: ${response.statusText}`);
          }

          const responseData = await response.json();
          const data = responseData.data || responseData;

          accessToken = data.accessToken;
          refreshToken = data.refreshToken;

          log(`✅ Token 刷新成功！`, 'success');
          log(`🔑 新 Access Token: ${accessToken.substring(0, 30)}...`, 'info');
          updateStatus();
        } catch (error) {
          log(`❌ Token 刷新失败: ${error.message}`, 'error');
        }
      }

      // 5. 获取所有会话
      async function getSessions() {
        try {
          log('📱 正在获取所有会话...', 'info');

          const response = await fetch(`${API_URL()}/auth/sessions`, {
            method: 'GET',
            headers: {
              Authorization: `Bearer ${accessToken}`,
            },
          });

          if (!response.ok) {
            throw new Error(`获取会话失败: ${response.statusText}`);
          }

          const responseData = await response.json();
          const data = responseData.data || responseData;

          log(`✅ 找到 ${data.total} 个活动会话`, 'success');

          const container = document.getElementById('sessionsContainer');
          container.style.display = 'block';
          container.innerHTML = '<h3>活动会话列表</h3>';

          data.sessions.forEach((session, index) => {
            const div = document.createElement('div');
            div.className = 'session-item';
            div.innerHTML = `
            <div><strong>会话 ${index + 1}</strong> <span class="badge">ID: ${session.id.substring(0, 8)}</span></div>
            <div>🖥️ 设备: ${session.deviceInfo.substring(0, 50)}...</div>
            <div>🌐 IP: ${session.ipAddress}</div>
            <div>🕐 创建: ${new Date(session.createdAt).toLocaleString()}</div>
            <div>⏰ 过期: ${new Date(session.expiresAt).toLocaleString()}</div>
          `;
            container.appendChild(div);
          });
        } catch (error) {
          log(`❌ 获取会话失败: ${error.message}`, 'error');
        }
      }

      // 6. 登出
      async function logout() {
        try {
          log('🚪 正在登出...', 'info');

          const response = await fetch(`${API_URL()}/auth/logout`, {
            method: 'POST',
            headers: {
              Authorization: `Bearer ${accessToken}`,
            },
          });

          if (!response.ok) {
            throw new Error(`登出失败: ${response.statusText}`);
          }

          accessToken = null;
          refreshToken = null;
          document.getElementById('username').textContent = '-';
          document.getElementById('sessionsContainer').style.display = 'none';

          log(`✅ 登出成功！`, 'success');
          updateStatus();
        } catch (error) {
          log(`❌ 登出失败: ${error.message}`, 'error');
        }
      }

      // 初始化
      log('🚀 Web3 Auth 测试工具已就绪', 'info');
      log('📌 请按顺序执行: 1️⃣ 连接钱包 → 2️⃣ 登录 → 3️⃣ 测试功能', 'info');
      updateStatus();

      // 全局阻止页面刷新（调试用）
      window.isProcessing = false;

      // 方案1: beforeunload 事件（阻止用户主动刷新）
      window.addEventListener('beforeunload', function (e) {
        console.log(
          '🔍 检测到页面即将刷新',
          'isProcessing:',
          window.isProcessing,
        );

        // 如果正在处理登录流程，阻止刷新
        if (window.isProcessing) {
          console.warn('⚠️ 登录流程正在进行，阻止页面刷新');
          e.preventDefault();
          e.returnValue = '登录正在进行中，确定要离开吗？';
          return e.returnValue;
        }
      });

      // 方案2: 拦截 Live Server 的自动刷新（WebSocket 连接）
      // Live Server 使用 WebSocket 触发页面刷新
      const originalWebSocket = window.WebSocket;
      window.WebSocket = function (...args) {
        console.log('🔌 检测到 WebSocket 连接尝试:', args[0]);

        // 如果是 Live Server 的 WebSocket
        if (args[0].includes('ws://') || args[0].includes('wss://')) {
          console.log('🚫 已拦截 Live Server WebSocket，防止自动刷新');

          // 创建一个假的 WebSocket 对象，但不建立连接
          return {
            send: () => {},
            close: () => {},
            addEventListener: () => {},
            removeEventListener: () => {},
            readyState: 3, // CLOSED
          };
        }

        // 其他 WebSocket 正常创建
        return new originalWebSocket(...args);
      };

      // 方案3: 拦截 location 相关的刷新
      const originalReload = window.location.reload.bind(window.location);
      window.location.reload = function () {
        if (window.isProcessing) {
          console.warn('⚠️ 拦截了 location.reload() 调用');
          return;
        }
        originalReload();
      };

      console.log('✅ 已启用防刷新保护机制');
    </script>
  </body>
</html>
