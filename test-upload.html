<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件上传测试</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
        button { background: #007bff; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
        .result { margin-top: 20px; padding: 15px; border-radius: 4px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; color: #155724; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; color: #721c24; }
        .info { background: #d1ecf1; border: 1px solid #bee5eb; color: #0c5460; }
    </style>
</head>
<body>
    <h1>🧪 文件上传接口测试</h1>
    
    <div class="info">
        <h3>📋 测试信息</h3>
        <p><strong>服务器地址:</strong> http://localhost:8079</p>
        <p><strong>接口路径:</strong> /api/storage/upload</p>
        <p><strong>请求方法:</strong> POST</p>
    </div>

    <form id="uploadForm">
        <div class="form-group">
            <label for="file">选择文件:</label>
            <input type="file" id="file" name="file" required>
        </div>
        
        <div class="form-group">
            <label for="fileType">文件类型:</label>
            <select id="fileType" name="fileType" required>
                <option value="">请选择文件类型</option>
                <option value="avatar">头像 (avatar)</option>
                <option value="course_cover">课程封面 (course_cover)</option>
                <option value="lesson_video">课程视频 (lesson_video)</option>
                <option value="lesson_document">课程文档 (lesson_document)</option>
                <option value="certificate">证书 (certificate)</option>
                <option value="document">文档 (document)</option>
            </select>
        </div>
        
        <button type="submit">🚀 上传文件</button>
    </form>

    <div id="result"></div>

    <script>
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const resultDiv = document.getElementById('result');
            const fileInput = document.getElementById('file');
            const fileTypeInput = document.getElementById('fileType');
            
            if (!fileInput.files[0]) {
                showResult('请选择一个文件', 'error');
                return;
            }
            
            if (!fileTypeInput.value) {
                showResult('请选择文件类型', 'error');
                return;
            }
            
            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('fileType', fileTypeInput.value);
            
            showResult('📤 正在上传...', 'info');
            
            try {
                const response = await fetch('http://localhost:8079/api/storage/upload', {
                    method: 'POST',
                    body: formData
                });
                
                const responseText = await response.text();
                
                if (response.ok) {
                    let data;
                    try {
                        data = JSON.parse(responseText);
                    } catch (e) {
                        data = responseText;
                    }
                    
                    showResult(`✅ 上传成功!\n\n响应数据:\n${JSON.stringify(data, null, 2)}`, 'success');
                } else {
                    showResult(`❌ 上传失败!\n\n状态码: ${response.status}\n响应: ${responseText}`, 'error');
                }
            } catch (error) {
                showResult(`❌ 网络错误!\n\n错误信息: ${error.message}\n\n可能原因:\n1. 服务器未启动 (检查 http://localhost:8079)\n2. CORS 问题\n3. 网络连接问题`, 'error');
            }
        });
        
        function showResult(message, type) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = `result ${type}`;
            resultDiv.innerHTML = `<pre>${message}</pre>`;
        }
    </script>
</body>
</html>
